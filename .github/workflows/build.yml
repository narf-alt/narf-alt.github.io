name: Build Lana Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg dpkg python3-pip xz-utils zstd

      - name: Clone Silex
        run: |
          git clone https://github.com/5hux1n/Silex.git silex

      - name: Fix Silex DebianPackager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("silex/util/DebianPackager.py")
          text = path.read_text()

          patterns = [
              r"^[ \t]*subprocess\.run\(\['mv', control_tar\.replace\('\.gz', ''\), 'control\.tar'\], cwd=tmpdir, check=True\)[ \t]*\n",
              r"^[ \t]*subprocess\.run\(\['mv', control_tar\.replace\('\.xz', ''\), 'control\.tar'\], cwd=tmpdir, check=True\)[ \t]*\n",
              r"^[ \t]*subprocess\.run\(\['mv', 'control\.tar\.gz', control_tar\], cwd=tmpdir, check=True\)[ \t]*\n",
              r"^[ \t]*subprocess\.run\(\['mv', 'control\.tar\.xz', control_tar\], cwd=tmpdir, check=True\)[ \t]*\n",
          ]

          for pattern in patterns:
              text, count = re.subn(pattern, "", text, flags=re.MULTILINE)
              print(f"Removed {count} matching command(s).")

          path.write_text(text)
          PY

          python3 -m py_compile silex/util/DebianPackager.py

          if grep -nE "mv.*control_tar|mv.*control\.tar\.(gz|xz).*control_tar" silex/util/DebianPackager.py; then
            echo "ERROR: Broken mv command still exists."
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages -r silex/requirements.txt

      - name: Copy repository files
        run: |
          cp -r Packages silex/
          cp -r Styles silex/

      - name: Fetch private paid DEBs into the build environment
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 -m pip install --break-system-packages boto3

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          import boto3
          from botocore.exceptions import ClientError

          # The paid builds. This mirrors the Worker's PRODUCTS / *_BUILDS
          # (same bucket, same R2 keys, same architectures). The DEBs are
          # downloaded into silex/Packages/<folder>/ ONLY: that directory is
          # part of the temporary build tree and is never copied to docs/.
          #
          #  (Packages folder, bundle id, architecture, R2 object key)
          PAID = [
              ("Lana",    "com.narf.lana",    "iphoneos-arm64",  "pkg/com.lana.theme_1.3_iphoneos-arm64.deb"),
              ("Lana",    "com.narf.lana",    "iphoneos-arm64e", "pkg/com.lana.theme_1.3_iphoneos-arm64e.deb"),
              ("NarPill", "com.narf.narpill", "iphoneos-arm64",  "pkg/com.narf.narpill_1.4.0-2+debug_iphoneos-arm64.deb"),
              ("Prysmic", "com.narf.prysmic", "iphoneos-arm64",  "pkg/com.narf.prysmic_1.0.0_iphoneos-arm64.deb"),
          ]

          need = ["R2_ACCOUNT_ID", "R2_BUCKET", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY"]
          missing = [n for n in need if not os.environ.get(n, "").strip()]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secret(s): " + ", ".join(missing)
                  + ". Add them under Settings > Secrets and variables > Actions."
              )

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID'].strip()}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"].strip(),
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"].strip(),
              region_name="auto",
          )
          bucket = os.environ["R2_BUCKET"].strip()

          def control(path, field):
              return subprocess.run(
                  ["dpkg-deb", "-f", str(path), field],
                  check=True, capture_output=True, text=True,
              ).stdout.strip()

          def digests(path):
              h = {"md5": hashlib.md5(), "sha1": hashlib.sha1(), "sha256": hashlib.sha256()}
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      for x in h.values():
                          x.update(chunk)
              return {k: v.hexdigest() for k, v in h.items()}

          manifest = []

          for folder, bundle, arch, key in PAID:
              dest_dir = Path("silex/Packages") / folder
              if not dest_dir.is_dir():
                  raise SystemExit(f"Packages/{folder} does not exist in the repository.")

              dest = dest_dir / Path(key).name

              try:
                  s3.download_file(bucket, key, str(dest))
              except ClientError as e:
                  raise SystemExit(
                      f"Could not download private DEB '{key}' from R2 "
                      f"({e.response.get('Error', {}).get('Code', 'error')}). "
                      "Check the object key and the R2 token permissions."
                  )

              # The file must be a real DEB for the architecture the Worker
              # will hand out for this key.
              try:
                  got_arch = control(dest, "Architecture")
                  version = control(dest, "Version")
              except subprocess.CalledProcessError:
                  raise SystemExit(f"{key} is not a valid .deb file.")

              if got_arch != arch:
                  raise SystemExit(
                      f"{key}: control says Architecture '{got_arch}', expected '{arch}'."
                  )

              d = digests(dest)
              manifest.append({
                  "folder": folder,
                  "bundle": bundle,
                  "arch": arch,
                  "key": key,
                  "file": dest.name,
                  "version": version,
                  "size": dest.stat().st_size,
                  **d,
              })
              print(f"fetched {bundle} [{arch}] {version}  {dest.stat().st_size} bytes  sha256={d['sha256']}")

          # Checksums of the ORIGINAL files (the exact bytes the Worker serves).
          # Used later to make the index describe those bytes, and to verify
          # that no private DEB leaks into the published site.
          Path("silex/.private-debs.json").write_text(json.dumps(manifest, indent=2))
          PY

      - name: Build with Silex
        run: |
          cd silex
          python3 index.py

      - name: Add Narf brand logo
        run: |
          mkdir -p silex/docs/assets
          cp Styles/narf-brand.png silex/docs/assets/narf-brand.png

      - name: Copy Lana Wallpapers
        run: |
          mkdir -p silex/docs/assets/wallpapers/lana-01
          cp -r Styles/wallpapers/lana-01/. silex/docs/assets/wallpapers/lana-01/

      - name: Normalize Lana Wallpaper filenames
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Operates ONLY on the build output copy; the source folder
          # Styles/wallpapers/lana-01/ is never touched.
          d = Path("silex/docs/assets/wallpapers/lana-01")

          def real_ext(path):
              with path.open("rb") as f:
                  head = f.read(8)
              if head.startswith(b"\xff\xd8\xff"):
                  return "jpg"
              if head.startswith(b"\x89PNG\r\n\x1a\n"):
                  return "png"
              return None

          plan = {}
          for p in sorted(x for x in d.iterdir() if x.is_file()):
              m = re.match(r"^(\d{2})\.", p.name)
              if not m:
                  raise SystemExit(f"Unexpected file name: {p.name}")
              num = m.group(1)
              ext = real_ext(p)
              if ext is None:
                  raise SystemExit(f"Unknown image type (not JPEG/PNG): {p.name}")
              if num in plan:
                  raise SystemExit(f"Duplicate wallpaper number: {num}")
              plan[num] = (p, f"{num}.{ext}")

          expected = [f"{i:02d}" for i in range(1, 19)]
          if sorted(plan) != expected:
              raise SystemExit(f"Expected wallpapers 01-18, found: {sorted(plan)}")

          # Two-phase rename: avoids any collision between old and new names.
          temps = []
          for num, (p, final) in plan.items():
              tmp = d / f".tmp_{num}"
              p.rename(tmp)
              temps.append((tmp, d / final))

          for tmp, final in temps:
              tmp.rename(final)

          for num in expected:
              old, final = plan[num]
              print(f"{old.name} -> {final}")

          non_jpg = [final for _, final in plan.values() if not final.endswith(".jpg")]
          if non_jpg:
              print("NOTE: files whose real content is PNG keep a .png extension: " + ", ".join(non_jpg))
          PY

      - name: Fix Release architectures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          release = Path("silex/docs/Release")
          text = release.read_text()

          old = "Architectures: iphoneos-arm64"
          new = "Architectures: iphoneos-arm64 iphoneos-arm64e"

          if old not in text:
              raise SystemExit("Could not find Architectures line.")

          text = text.replace(old, new, 1)
          release.write_text(text)
          PY

      - name: Add uncompressed Packages file
        run: |
          xz -d -c silex/docs/Packages.xz > silex/docs/Packages

      - name: Mark Lana, NarPill and Prysmic as commercial
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("silex/docs/Packages")
          text = path.read_text()

          TAG = "cydia::commercial"
          targets = ["com.narf.lana", "com.narf.narpill", "com.narf.prysmic"]

          found = {pkg: 0 for pkg in targets}
          tagged = {pkg: 0 for pkg in targets}

          def package_name(lines):
              for line in lines:
                  if line.startswith("Package:"):
                      return line.split(":", 1)[1].strip()
              return None

          def has_tag(lines):
              for line in lines:
                  if line.startswith("Tag:"):
                      tags = [t.strip() for t in line.split(":", 1)[1].split(",")]
                      if TAG in tags:
                          return True
              return False

          output = []

          # Every stanza of each target package is handled, so multiple
          # architectures / versions of the same package all get the tag.
          for stanza in text.split("\n\n"):
              lines = stanza.splitlines()
              pkg = package_name(lines)

              if pkg in found:
                  found[pkg] += 1

                  if not has_tag(lines):
                      tag_index = None
                      for i, line in enumerate(lines):
                          if line.startswith("Tag:"):
                              tag_index = i
                              break

                      if tag_index is not None:
                          # A Tag field already exists: extend it (a stanza must
                          # not contain two Tag fields).
                          lines[tag_index] = lines[tag_index].rstrip() + ", " + TAG
                      else:
                          insert_at = None

                          for i, line in enumerate(lines):
                              if line.startswith("Section:"):
                                  insert_at = i + 1
                                  break

                          if insert_at is None:
                              insert_at = len(lines)

                          lines.insert(insert_at, "Tag: " + TAG)

                      trailing = "\n" if stanza.endswith("\n") else ""
                      stanza = "\n".join(lines) + trailing

                  tagged[pkg] += 1

              output.append(stanza)

          # Fail the build if a package was not found at all.
          for pkg in targets:
              if found[pkg] == 0:
                  raise SystemExit(f"Package was not found: {pkg}")

          path.write_text("\n\n".join(output))

          # Re-read the written file and verify every stanza of every target.
          verify = {pkg: [0, 0] for pkg in targets}

          for stanza in path.read_text().split("\n\n"):
              lines = stanza.splitlines()
              pkg = package_name(lines)

              if pkg in verify:
                  verify[pkg][0] += 1
                  if has_tag(lines):
                      verify[pkg][1] += 1

          for pkg in targets:
              total, with_tag = verify[pkg]

              if total == 0:
                  raise SystemExit(f"Package disappeared after write: {pkg}")

              if total != found[pkg] or with_tag != total:
                  raise SystemExit(
                      f"Commercial tag was not added to all stanzas of {pkg} "
                      f"({with_tag}/{total})."
                  )

              print(f"{pkg} marked as {TAG} ({with_tag}/{total} stanza(s)).")
          PY

      - name: Align paid checksums with served DEBs and remove private DEBs from public output
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          docs = Path("silex/docs")
          manifest = json.loads(Path("silex/.private-debs.json").read_text())

          paid_ids = {m["bundle"] for m in manifest}
          by_key = {(m["bundle"], m["arch"]): m for m in manifest}

          packages = docs / "Packages"
          stanzas = [s for s in re.split(r"\n\n+", packages.read_text().strip()) if s.strip()]

          def field(lines, name):
              for i, line in enumerate(lines):
                  if line.startswith(name + ":"):
                      return i, line.split(":", 1)[1].strip()
              return None, None

          matched = set()
          private_files = set()
          out = []

          for stanza in stanzas:
              lines = stanza.splitlines()
              _, pkg = field(lines, "Package")

              if pkg in paid_ids:
                  _, arch = field(lines, "Architecture")
                  m = by_key.get((pkg, arch))
                  if m is None:
                      raise SystemExit(
                          f"Index lists {pkg} [{arch}] but no private build was fetched for it."
                      )
                  if (pkg, arch) in matched:
                      raise SystemExit(f"Duplicate index entry for {pkg} [{arch}].")
                  matched.add((pkg, arch))

                  # Size / MD5sum / SHA1 / SHA256 must describe the file that
                  # the Worker really serves (the original R2 object), not the
                  # copy Silex re-wrote its control file into.
                  for name, value in (
                      ("Size", str(m["size"])),
                      ("MD5sum", m["md5"]),
                      ("SHA1", m["sha1"]),
                      ("SHA256", m["sha256"]),
                  ):
                      i, _ = field(lines, name)
                      if i is None:
                          raise SystemExit(f"{pkg} [{arch}]: stanza has no {name} field.")
                      lines[i] = f"{name}: {value}"

                  _, fn = field(lines, "Filename")
                  if fn:
                      private_files.add(fn)

                  stanza = "\n".join(lines)

              out.append(stanza)

          expected = set(by_key)
          if matched != expected:
              raise SystemExit(
                  "Private builds missing from the generated index: "
                  + ", ".join(f"{b} [{a}]" for b, a in sorted(expected - matched))
              )

          packages.write_text("\n\n".join(out) + "\n")

          # Private DEBs must not be published. The index entries stay (Sileo
          # gets the real download URL from the Worker's authorize_download).
          removed = []

          for fn in sorted(private_files):
              p = (docs / fn).resolve()
              if docs.resolve() in p.parents and p.is_file():
                  p.unlink()
                  removed.append(str(p.relative_to(docs.resolve())))

          # Belt and braces: anything left in the output whose control file
          # says it is a paid package goes too, whatever it is called.
          for p in sorted(docs.rglob("*.deb")):
              r = subprocess.run(
                  ["dpkg-deb", "-f", str(p), "Package"],
                  capture_output=True, text=True,
              )
              if r.returncode == 0 and r.stdout.strip() in paid_ids:
                  p.unlink()
                  removed.append(str(p.relative_to(docs)))

          print("Removed from public output:", removed)
          PY

      - name: Regenerate compressed Packages files
        run: |
          xz -c -9 silex/docs/Packages > silex/docs/Packages.xz
          bzip2 -c -9 silex/docs/Packages > silex/docs/Packages.bz2
          zstd -q -19 -c silex/docs/Packages > silex/docs/Packages.zst

      - name: Regenerate Release checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          docs = Path("silex/docs")
          release = docs / "Release"

          text = release.read_text()

          for name in [
              "Packages",
              "Packages.bz2",
              "Packages.xz",
              "Packages.zst"
          ]:
              path = docs / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              size = path.stat().st_size

              old_lines = []

              for line in text.splitlines():
                  if line.endswith(f" {name}") and line[:64].strip():
                      continue
                  old_lines.append(line)

              text = "\n".join(old_lines) + "\n"

              marker = "SHA256:\n"

              if marker not in text:
                  text += "\nSHA256:\n"

              text = text.replace(
                  marker,
                  marker + f" {digest} {size} {name}\n",
                  1
              )

          release.write_text(text)
          PY

      - name: Copy generated repository
        run: |
          rm -rf docs
          cp -r silex/docs docs

      - name: Add Sileo Payment Endpoint
        run: |
          printf '%s\n' 'https://narf-store.narf-ios26.workers.dev/' > docs/payment_endpoint

      - name: Verify repository index and private DEB protection
        run: |
          python3 - <<'PY'
          import bz2
          import hashlib
          import json
          import lzma
          import re
          import subprocess
          from pathlib import Path

          docs = Path("docs")
          manifest = json.loads(Path("silex/.private-debs.json").read_text())

          paid_ids = {m["bundle"] for m in manifest}
          by_key = {(m["bundle"], m["arch"]): m for m in manifest}
          errors = []

          def fail(msg):
              errors.append(msg)

          def field(lines, name):
              for line in lines:
                  if line.startswith(name + ":"):
                      return line.split(":", 1)[1].strip()
              return None

          # 1. Payment endpoint
          if (docs / "payment_endpoint").read_text().strip() != "https://narf-store.narf-ios26.workers.dev/":
              fail("payment_endpoint is wrong.")

          # 2. Index entries
          packages_bytes = (docs / "Packages").read_bytes()
          stanzas = [s for s in re.split(r"\n\n+", packages_bytes.decode().strip()) if s.strip()]
          seen = set()
          archs = set()

          for stanza in stanzas:
              lines = stanza.splitlines()
              pkg = field(lines, "Package")
              arch = field(lines, "Architecture")
              fn = field(lines, "Filename")
              archs.add(arch)

              if pkg in paid_ids:
                  m = by_key.get((pkg, arch))
                  if m is None:
                      fail(f"{pkg} [{arch}] is in the index without a private build.")
                      continue
                  seen.add((pkg, arch))

                  tags = [t.strip() for t in (field(lines, "Tag") or "").split(",")]
                  if "cydia::commercial" not in tags:
                      fail(f"{pkg} [{arch}] is not tagged cydia::commercial (would be listed as free).")

                  for name, key in (("Size", "size"), ("MD5sum", "md5"), ("SHA1", "sha1"), ("SHA256", "sha256")):
                      if field(lines, name) != str(m[key]):
                          fail(f"{pkg} [{arch}] {name} does not match the served DEB.")

                  if fn and (docs / fn).exists():
                      fail(f"{pkg} [{arch}] DEB is publicly reachable at {fn}.")
              else:
                  # Free packages: Filename must exist and match Size/SHA256.
                  p = docs / (fn or "")
                  if not fn or not p.is_file():
                      fail(f"{pkg} [{arch}]: Filename '{fn}' is not in the published site.")
                  else:
                      if str(p.stat().st_size) != field(lines, "Size"):
                          fail(f"{pkg} [{arch}]: Size does not match {fn}.")
                      if hashlib.sha256(p.read_bytes()).hexdigest() != field(lines, "SHA256"):
                          fail(f"{pkg} [{arch}]: SHA256 does not match {fn}.")

          for k in sorted(set(by_key) - seen):
              fail(f"{k[0]} [{k[1]}] is missing from the index.")

          # 3. No paid DEB anywhere in the published tree
          served = {m["file"] for m in manifest}
          for p in docs.rglob("*.deb"):
              r = subprocess.run(["dpkg-deb", "-f", str(p), "Package"], capture_output=True, text=True)
              if p.name in served or (r.returncode == 0 and r.stdout.strip() in paid_ids):
                  fail(f"Private DEB is published: {p}")

          # 4. Compressed indexes decode to exactly Packages
          decoded = {
              "Packages": packages_bytes,
              "Packages.xz": lzma.decompress((docs / "Packages.xz").read_bytes()),
              "Packages.bz2": bz2.decompress((docs / "Packages.bz2").read_bytes()),
              "Packages.zst": subprocess.run(
                  ["zstd", "-dc", str(docs / "Packages.zst")],
                  check=True, capture_output=True,
              ).stdout,
          }
          for name, data in decoded.items():
              if data != packages_bytes:
                  fail(f"{name} does not decompress to Packages.")

          # 5. Release checksums and architectures
          release = (docs / "Release").read_text()
          listed = {}
          in_sha = False
          for line in release.splitlines():
              if line.strip() == "SHA256:":
                  in_sha = True
                  continue
              if in_sha and line.startswith(" "):
                  parts = line.split()
                  if len(parts) == 3:
                      listed[parts[2]] = (parts[0], int(parts[1]))
              elif in_sha and line.strip():
                  in_sha = False

          for name in ("Packages", "Packages.bz2", "Packages.xz", "Packages.zst"):
              data = (docs / name).read_bytes()
              want = (hashlib.sha256(data).hexdigest(), len(data))
              if listed.get(name) != want:
                  fail(f"Release SHA256/size for {name} is wrong or missing.")

          rel_archs = set((re.search(r"^Architectures:\s*(.*)$", release, re.M) or [None, ""])[1].split())
          for a in archs:
              if a not in rel_archs:
                  fail(f"Release Architectures is missing {a}.")

          # 6. Depictions / assets still generated for every paid product
          for b in paid_ids:
              for rel in (f"depiction/native/{b}.json", f"depiction/web/{b}.html", f"assets/{b}/icon.png"):
                  if not (docs / rel).is_file():
                      fail(f"Missing {rel}")

          if errors:
              raise SystemExit("Repository verification failed:\n - " + "\n - ".join(errors))

          print("Repository verified: index valid, checksums correct, no private DEB published.")
          for m in manifest:
              print(f"  {m['bundle']} [{m['arch']}] {m['version']}  sha256={m['sha256']}")
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs

          git diff --cached --quiet || git commit -m "Enable Lana commercial Sileo payments"

          git push
