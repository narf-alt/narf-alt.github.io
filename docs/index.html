<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NARF</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    color-scheme: dark;
    --bg: #000;
    --surface: #0e0e11;
    --surface-2: #16161a;
    --line: rgba(255, 255, 255, 0.08);
    --line-2: rgba(255, 255, 255, 0.15);
    --text: #f5f5f7;
    --text-2: #9a9ea7;
    --muted: #676b75;
    --orange: #ff7a00;
    --orange-hi: #ff9124;
    --orange-soft: rgba(255,122,0,.15);
    --orange-line: rgba(255,122,0,.3);
    --r-lg: 20px;
    --r-md: 14px;
    --ease: cubic-bezier(.2,.8,.2,1);
}

html { background: var(--bg); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    padding:
        calc(14px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(14px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
}

a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

.page { width: 100%; max-width: 1180px; margin: 0 auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Header ---------- */
.topbar { height: 60px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

.brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    font-size: 26px; font-weight: 900; letter-spacing: -0.02em;
    color: #fff;
}

/* Balanced Logo Size & Vertical Alignment */
.brand-logo-svg {
    width: 28px; height: 28px;
    fill: #fff;
    display: block;
}

.account-wrap { position: relative; }

.icon-btn {
    width: 42px; height: 42px; display: grid; place-items: center;
    border-radius: 50%; background: var(--surface);
    border: 1px solid var(--line-2); cursor: pointer;
    transition: border-color .18s var(--ease);
}
.icon-btn:hover { border-color: var(--orange); }
.icon-btn svg { width: 20px; height: 20px; }

.account-menu {
    position: absolute; right: 0; top: calc(100% + 8px);
    width: 260px; z-index: 30;
    background: var(--surface-2);
    border: 1px solid var(--line-2);
    border-radius: var(--r-md);
    padding: 8px;
    box-shadow: 0 18px 40px rgba(0,0,0,.8);
}
.account-menu[hidden] { display: none; }
.account-menu-head { padding: 10px 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.account-menu-head strong { display: block; font-size: 14px; }
.account-menu-head span { font-size: 12px; color: var(--muted); }
.account-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px; border-radius: 8px; font-size: 13px; color: var(--text-2);
}

/* ---------- Search ---------- */
.search { margin-bottom: 20px; }
.search-box {
    display: flex; align-items: center; gap: 6px;
    height: 50px; padding: 0 4px 0 16px;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px;
}
.search-box:focus-within { border-color: var(--orange); }
.search-input {
    flex: 1; min-width: 0; height: 100%;
    background: transparent; border: 0; outline: 0; font-size: 15px;
}
.search-input::placeholder { color: var(--muted); }
.search-btn {
    height: 42px; width: 42px; display: inline-grid; place-items: center;
    background: var(--orange); color: #000; border: 0; border-radius: 50%;
    cursor: pointer; flex-shrink: 0;
}
.search-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }

/* ---------- Section headers ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }
.head h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 800; }
.head p { color: var(--muted); font-size: 13px; margin-top: 1px; }

/* ---------- Category Navigation ---------- */
.cats { margin-bottom: 20px; }
.cats-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.cats-row::-webkit-scrollbar { display: none; }
.cat {
    flex: 0 0 auto; min-height: 38px; display: inline-flex; align-items: center; gap: 6px;
    padding: 0 16px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px;
    color: var(--text-2); font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
}
.cat[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #000; }

/* ---------- HAVOC-STYLE SHELF ---------- */
.shelf {
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: var(--r-lg);
    overflow: hidden;
}
.shelf[hidden] { display: none; }

.list {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(3, auto);
    grid-auto-columns: calc(100% - 20px);
    overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}
.list::-webkit-scrollbar { display: none; }

.pkg {
    position: relative; scroll-snap-align: start;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; min-height: 72px;
    transition: background .15s var(--ease);
}
.pkg[hidden] { display: none; }
.pkg:active { background: rgba(255, 255, 255, 0.04); }

.pkg:not(:nth-child(3n))::after {
    content: ""; position: absolute; left: 66px; right: 14px; bottom: 0;
    height: 1px; background: var(--line);
}

.pkg .icon { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; object-fit: cover; background: var(--surface-2); }

.pkg-main { flex: 1; min-width: 0; }
.pkg-name { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.2; }
.pkg-desc {
    color: var(--text-2); font-size: 12px; line-height: 1.3; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.cta {
    flex-shrink: 0; min-width: 64px; height: 32px; display: inline-grid; place-items: center;
    padding: 0 12px; border-radius: 999px;
    background: var(--orange-soft); border: 1px solid var(--orange-line);
    color: var(--orange); font-size: 13px; font-weight: 800;
}
.pkg:hover .cta { background: var(--orange); color: #000; }

.dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--orange); width: 14px; border-radius: 99px; }

/* Footer */
.footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>

<body>
<div class="page">

<!-- ================= HEADER ================= -->
<header class="topbar">
    <a class="brand" href="#">
        <svg class="brand-logo-svg" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 10 C25 10 10 30 10 55 C10 75 30 90 50 90 C70 90 90 75 90 55 C90 30 75 10 50 10 Z M32 42 C38 42 43 47 40 55 C37 62 28 60 27 52 C26 46 29 42 32 42 Z M68 42 C71 42 74 46 73 52 C72 60 63 62 60 55 C57 47 62 42 68 42 Z"/>
        </svg>
        <span>Narf</span>
    </a>

    <div class="account-wrap">
        <button class="icon-btn" id="account-btn" type="button" aria-label="Account">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
    </div>
</header>

<!-- ================= SEARCH ================= -->
<section class="search">
    <form id="search-form" class="search-box">
        <input id="search-input" class="search-input" type="search" placeholder="Search" autocomplete="off">
        <button class="search-btn" type="submit">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
        </button>
    </form>
</section>

<!-- ================= CATEGORIES ================= -->
<nav class="cats">
    <div class="cats-row">
        <button class="cat" type="button" aria-pressed="true">🔥 Popular</button>
        <button class="cat" type="button" aria-pressed="false">🛠️ Tweaks</button>
        <button class="cat" type="button" aria-pressed="false">🪶 Themes</button>
    </div>
</nav>

<!-- ================= PRODUCTS (HAVOC STYLE SHELF) ================= -->
<main>
    <div class="head">
        <h2>Popular Tweaks</h2>
    </div>

    <div class="shelf">
        <div class="list" id="list">
            
            <a class="pkg" href="#">
                <img class="icon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 24 24' fill='%23ff7a00'><rect width='24' height='24' rx='6' fill='%23222'/><path d='M12 6v12M6 12h12' stroke='%23ff7a00' stroke-width='2'/></svg>" alt="">
                <div class="pkg-main">
                    <div class="pkg-name">NowLyrics</div>
                    <div class="pkg-desc">Synced lyrics in place of the track title</div>
                </div>
                <span class="cta">$1.99</span>
            </a>

            <a class="pkg" href="#">
                <img class="icon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23222'/><circle cx='12' cy='12' r='5' fill='%23ff7a00'/></svg>" alt="">
                <div class="pkg-main">
                    <div class="pkg-name">StageExpansion</div>
                    <div class="pkg-desc">Get more freedom with StageManager</div>
                </div>
                <span class="cta">$6.99</span>
            </a>

            <a class="pkg" href="#">
                <img class="icon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23222'/><polygon points='12,4 20,20 4,20' fill='%23ff7a00'/></svg>" alt="">
                <div class="pkg-main">
                    <div class="pkg-name">lilywhite</div>
                    <div class="pkg-desc">Your whole status bar in one clean capsule</div>
                </div>
                <span class="cta">$2.49</span>
            </a>

            <a class="pkg" href="#">
                <img class="icon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23222'/><rect x='6' y='6' width='12' height='12' fill='%23ff7a00'/></svg>" alt="">
                <div class="pkg-main">
                    <div class="pkg-name">Crane</div>
                    <div class="pkg-desc">Multiple containers for your applications</div>
                </div>
                <span class="cta">$4.99</span>
            </a>

        </div>
        <div class="dots"><i class="on"></i><i></i></div>
    </div>
</main>

<footer class="footer">
    <p>Narf Store © 2026</p>
</footer>

</div>
</body>
</html>
